<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        /* Basic body and container styles from home.css for consistency */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0f1a20, #050d12);
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex; /* Use flexbox for centering content vertically */
            flex-direction: column;
            align-items: center; /* Center content horizontally */
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            flex-grow: 1; /* Allow container to grow and take up available space */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: #5c8aff;
            font-size: 3.5em;
            margin: 20px 0;
            text-shadow: 0 0 15px #5c8aff, 0 0 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        /* Game Controls Styles */
        .game-controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-controls label {
            font-size: 1.1em;
        }

        .game-controls select,
        .game-controls button {
            padding: 10px 15px;
            font-size: 1em;
            cursor: pointer;
            background-color: #5c8aff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

         .game-controls select {
             background-color: #333;
             color: white;
         }

        .game-controls button:hover {
            background-color: #4a7cdb;
        }


        /* Sudoku Grid Styles */
        #sudoku-grid {
            display: grid;
            /* grid-template-columns and grid-template-rows will be set by JavaScript */
            gap: 1px;
            border: 2px solid #333; /* Add a border to the whole grid */
            margin: 20px auto; /* Center the grid */
            background-color: #fff; /* White background for the grid */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Add a subtle shadow */
        }

        .sudoku-cell {
            /* width and height will be set by JavaScript */
            text-align: center;
            font-size: 1.2em;
            border: 1px solid #bbb; /* Border for individual cells */
            box-sizing: border-box; /* Include border in cell size */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #333; /* Default text color for cells */
            user-select: none; /* Prevent text selection */
            transition: background-color 0.2s ease;
        }

         .sudoku-cell.prefilled {
             background-color: #eee; /* Light gray background for pre-filled cells */
             font-weight: bold;
             cursor: default; /* Change cursor for pre-filled cells */
         }

        .sudoku-cell.selected {
            background-color: #cce0ff; /* Light blue background for selected cell */
        }

         .sudoku-cell.error {
             background-color: #ffcccc; /* Light red background for error cells */
             color: #d9534f; /* Red text for error cells */
         }


        /* Styles for 3x3 blocks (will need to be dynamic based on grid size) */
        /* These will be more complex to apply with different grid sizes in CSS alone */


        /* Number Pad Styles */
        .number-pad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px); /* 3 columns for numbers 1-9 */
            gap: 5px;
            justify-content: center;
        }

        .number-pad button {
            padding: 10px;
            font-size: 1.2em;
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
             transition: background-color 0.3s ease;
        }

        .number-pad button:hover {
            background-color: #777;
        }

         .number-pad button.clear {
             background-color: #d9534f; /* Red color for clear button */
             grid-column: span 3; /* Make the clear button span all 3 columns */
         }

         .number-pad button.clear:hover {
             background-color: #c9302c;
         }


    </style>
</head>
<body>
    <div class="container">
        <h1>Sudoku</h1>

        <div class="game-controls">
            <label for="size-select">Select Size:</label>
            <select id="size-select">
                <option value="4">4x4</option>
                <option value="5">5x5</option>
                <option value="6">6x6</option>
                <option value="7">7x7</option>
                <option value="8">8x8</option>
                <option value="9" selected>9x9</option> <!-- 9x9 as default -->
            </select>
            <button id="start-button">Start Game</button>
        </div>


        <div id="sudoku-grid">
            <!-- The Sudoku cells will be generated by JavaScript -->
        </div>

        <div class="number-pad">
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="clear">Clear</button>
        </div>
    </div>

    <script>
        const sudokuGrid = document.getElementById('sudoku-grid');
        const sizeSelect = document.getElementById('size-select');
        const startButton = document.getElementById('start-button');
        const numberPad = document.querySelector('.number-pad');
        const numberPadButtons = numberPad.querySelectorAll('button');

        let selectedCell = null; // To keep track of the currently selected cell
        let currentGridSize = 9; // Default size

        startButton.addEventListener('click', () => {
            currentGridSize = parseInt(sizeSelect.value);
            createGrid(currentGridSize);
            generatePuzzle(currentGridSize); // Generate and fill the puzzle
        });

        function createGrid(size) {
            // Clear existing grid and selected cell
            sudokuGrid.innerHTML = '';
            selectedCell = null;

            // Calculate cell size dynamically (adjust 360px as needed for grid width)
            const gridWidth = 360; // You can adjust this based on your desired grid display size
            const gap = 1; // The gap in pixels
            const totalGap = (size - 1) * gap;
            const cellSize = (gridWidth - totalGap) / size;


            sudokuGrid.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
            sudokuGrid.style.gridTemplateRows = `repeat(${size}, ${cellSize}px)`;


            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.classList.add('sudoku-cell');
                // Add data attributes for row and column
                cell.dataset.row = Math.floor(i / size);
                cell.dataset.col = i % size;

                // Add click event listener to each cell
                cell.addEventListener('click', handleCellClick);

                sudokuGrid.appendChild(cell);
            }

             // Update number pad buttons based on grid size
            updateNumberPad(size);


            // TODO: Add logic to dynamically apply 3x3 (or other size) block borders in CSS/JS
        }

         function updateNumberPad(size) {
             // Hide buttons with numbers greater than the grid size
             numberPadButtons.forEach(button => {
                 const number = parseInt(button.dataset.number);
                 const clearButton = button.classList.contains('clear');

                 if (!isNaN(number) && number > size) {
                     button.style.display = 'none';
                 } else if (!clearButton) {
                      button.style.display = ''; // Show number buttons within size limit
                 }
             });
         }


        // Handle cell clicks
        function handleCellClick() {
            // Remove 'selected' class from previously selected cell
            if (selectedCell) {
                selectedCell.classList.remove('selected');
            }

             // If the clicked cell is pre-filled, don't allow selection
             if (this.classList.contains('prefilled')) {
                 selectedCell = null; // No cell is selected
                 return;
             }


            // Set the clicked cell as the selected cell and add the 'selected' class
            selectedCell = this;
            selectedCell.classList.add('selected');
        }

        // Add event listeners to number pad buttons
        numberPadButtons.forEach(button => {
            button.addEventListener('click', handleNumberPadClick);
        });

        // Handle number pad button clicks
        function handleNumberPadClick() {
            if (!selectedCell || selectedCell.classList.contains('prefilled')) {
                // No cell is selected or the selected cell is pre-filled, do nothing
                return;
            }

            // Remove any previous error indication
            selectedCell.classList.remove('error');

            if (this.classList.contains('clear')) {
                // Clear button clicked
                selectedCell.innerText = '';
            } else {
                // Number button clicked
                const number = this.dataset.number;

                // Basic validation: Check if the number is valid for the current grid size
                if (parseInt(number) > currentGridSize) {
                    alert(`Please enter a number between 1 and ${currentGridSize} for this grid size.`);
                    return;
                }


                // --- Bad move detection logic ---
                if (isInvalidMove(selectedCell, number)) {
                    selectedCell.classList.add('error'); // Indicate error visually
                    // Make the error indication temporary
                    setTimeout(() => {
                        selectedCell.classList.remove('error');
                    }, 1000); // Remove error class after 1 second
                    // alert("Invalid move! This number is already present in the same row, column, or block."); // Optional: keep alert or rely on visual cue
                    return; // Don't place the number if it's an invalid move
                }
                // --- End of bad move detection logic ---


                selectedCell.innerText = number;
            }
        }


         // Function to check if a move is invalid
        function isInvalidMove(cell, number) {
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);
            const value = parseInt(number);
            const cells = sudokuGrid.querySelectorAll('.sudoku-cell');

            // Check row
            for (let c = 0; c < currentGridSize; c++) {
                const cellIndex = row * currentGridSize + c;
                 if (cellIndex !== (row * currentGridSize + col)) { // Don't compare with itself
                     const cellValue = parseInt(cells[cellIndex].innerText);
                     if (!isNaN(cellValue) && cellValue === value) {
                         return true; // Invalid move in row
                     }
                 }
            }

            // Check column
            for (let r = 0; r < currentGridSize; r++) {
                const cellIndex = r * currentGridSize + col;
                 if (cellIndex !== (row * currentGridSize + col)) { // Don't compare with itself
                    const cellValue = parseInt(cells[cellIndex].innerText);
                    if (!isNaN(cellValue) && cellValue === value) {
                        return true; // Invalid move in column
                    }
                 }
            }

            // --- Block validation (only for 9x9) ---
            if (currentGridSize === 9) {
                const blockSize = 3; // Block size is 3x3 for 9x9 grid
                 const startRow = Math.floor(row / blockSize) * blockSize;
                 const startCol = Math.floor(col / blockSize) * blockSize;

                 for (let r = 0; r < blockSize; r++) {
                     for (let c = 0; c < blockSize; c++) {
                         const cellIndex = (startRow + r) * currentGridSize + (startCol + c);
                          if (cellIndex !== (row * currentGridSize + col)) { // Don't compare with itself
                             const cellValue = parseInt(cells[cellIndex].innerText);
                             if (!isNaN(cellValue) && cellValue === value) {
                                 return true; // Invalid move in block
                             }
                          }
                     }
                 }
            }
             // --- End of Block validation ---


            return false; // Move is valid
        }


         // --- Basic Grid Generation ---
         function generatePuzzle(size) {
             const cells = sudokuGrid.querySelectorAll('.sudoku-cell');
             const board = Array(size).fill(null).map(() => Array(size).fill(0)); // 2D array to represent the board

             // Simple approach: Place a few random valid numbers
             const numToPlace = Math.floor(size * size * 0.2); // Place about 20% of cells (adjustable)

             for (let i = 0; i < numToPlace; i++) {
                 let row, col, num;
                 do {
                     row = Math.floor(Math.random() * size);
                     col = Math.floor(Math.random() * size);
                     num = Math.floor(Math.random() * size) + 1;
                 } while (board[row][col] !== 0 || !isValid(board, row, col, num)); // Keep trying until a valid empty spot is found

                 board[row][col] = num; // Place the number in the board array
                 const cellIndex = row * size + col;
                 cells[cellIndex].innerText = num; // Update the cell in the HTML
                 cells[cellIndex].classList.add('prefilled'); // Mark as pre-filled
             }

             // You would typically implement a more sophisticated Sudoku generation algorithm here
             console.log("Generated basic puzzle (not necessarily solvable with a unique solution):", board);
         }

         // Helper function to check if placing a number is valid in the current board state (used for generation)
         function isValid(board, row, col, num) {
             const size = board.length;

             // Check row
             for (let c = 0; c < size; c++) {
                 if (board[row][c] === num) {
                     return false;
                 }
             }

             // Check column
             for (let r = 0; r < size; r++) {
                 if (board[r][col] === num) {
                     return false;
                 }
             }

             // Check block (only for 9x9 in this basic isValid for generation)
             if (size === 9) {
                 const blockSize = 3;
                 const startRow = Math.floor(row / blockSize) * blockSize;
                 const startCol = Math.floor(col / blockSize) * blockSize;

                 for (let r = 0; r < blockSize; r++) {
                     for (let c = 0; c < blockSize; c++) {
                         if (board[startRow + r][startCol + c] === num) {
                             return false;
                         }
                     }
                 }
             }

             return true; // Move is valid
         }


        // We no longer create a default grid on page load.
        // The grid is created when the user clicks "Start Game".

    </script>
</body>
</html>
