<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Crafting</title>
    <link rel="icon" type="image/png" href="Favicons/craft.png" sizes="16x16" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #inventory {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
        }
        .item {
            display: inline-block;
            border: 1px solid #ddd;
            padding: 5px;
            margin: 5px;
            cursor: pointer; /* Change cursor to pointer */
        }
		.item:active {
			cursor: grabbing; /* Change cursor to grabbing when dragging */
		}
        #craftingArea {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
        }
        #craftingSlots {
            display: flex;
            min-height: 60px; /* Ensure the crafting slots area is visible */
            border: 1px dashed #999; /* Visual cue for the drop zone */
        }
        #craftingSlots .item {
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
        }
		#recipeEditor {
			border: 1px solid #ccc;
			padding: 10px;
			margin-bottom: 20px;
		}
        #result {
            font-weight: bold;
        }
		.collapsible {
			background-color: #777;
			color: white;
			cursor: pointer;
			padding: 18px;
			width: 100%;
			border: none;
			text-align: left;
			outline: none;
			font-size: 15px;
		}

		.active, .collapsible:hover {
			background-color: #555;
		}

		.content {
			padding: 0 18px;
			display: none;
			overflow: hidden;
			background-color: #f1f1f1;
		}
		.recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
		/* Style for removing inventory items */
		.remove-item {
			color: red;
			cursor: pointer;
			margin-left: 5px;
		}
    </style>
</head>
<body>
    <h1>Custom Crafter</h1>
<h4>Start by adding a recipe</h4>

    <div id="inventory">
        <h2>Inventory</h2>
        <div class="item" data-item="wood" draggable="true">Wood</div>
        <div class="item" data-item="stone" draggable="true">Stone</div>
        <div class="item" data-item="iron" draggable="true">Iron</div>
        <div class="item" data-item="water" draggable="true">Water</div>
        <div class="item" data-item="dirt" draggable="true">Dirt</div>
        <div class="item" data-item="nothing" draggable="true">Nothing</div>


    </div>

    <div id="craftingArea">
        <h2>Crafting Area</h2>
        <p>Drag items from your inventory here.</p>
        <div id="craftingSlots"></div>
        <button onclick="craft()">Craft</button>
		<button onclick="craftAll()">Craft All</button>
        <div id="result"></div>
    </div>

	<div id="recipeEditor">
		<h2>Recipe Editor</h2>
		<label for="item1">Item 1:</label>
		<input type="text" id="item1"><br><br>

		<label for="item2">Item 2:</label>
		<input type="text" id="item2"><br><br>

		<label for="resultItem">Result:</label>
		<input type="text" id="resultItem"><br><br>

		<button onclick="addRecipe()">Add Recipe</button>
	</div>

	<div>
		<button type="button" class="collapsible">Recipes</button>
		<div class="content" id="recipeList">
			<!-- Recipes will be listed here -->
			<p>No recipes added yet.</p>
		</div>
	</div>

	<div>
        <h2>Import/Export Recipes</h2>
		<label for="exportFilename">Export Filename:</label>
        <input type="text" id="exportFilename" value="recipes"><br>
        <button onclick="exportRecipes()">Export Recipes</button>
        <input type="file" id="importFile" accept=".json">
        <button onclick="importRecipes()">Import Recipes</button>
    </div>

    <script>
        const inventory = document.getElementById('inventory');
        const craftingSlots = document.getElementById('craftingSlots');
        const resultDiv = document.getElementById('result');
		const item1Input = document.getElementById('item1');
		const item2Input = document.getElementById('item2');
		const resultItemInput = document.getElementById('resultItem');
        let selectedItems = [];
		const recipeListDiv = document.getElementById('recipeList');
		const exportFilenameInput = document.getElementById('exportFilename');

		// Collapsible recipes
		const collapsible = document.querySelector(".collapsible");
		collapsible.addEventListener("click", function() {
			this.classList.toggle("active");
			var content = this.nextElementSibling;
			if (content.style.display === "block") {
				content.style.display = "none";
			} else {
				content.style.display = "block";
			}
		});

		// Make items draggable
		const items = document.querySelectorAll('.item');
		items.forEach(item => {
			item.addEventListener('dragstart', dragStart);
            item.addEventListener('click', clickToMove);
		});

		craftingSlots.addEventListener('dragover', dragOver);
		craftingSlots.addEventListener('drop', drop);

		function dragStart(event) {
			event.dataTransfer.setData('text', event.target.dataset.item);
		}

		function dragOver(event) {
			event.preventDefault();
		}

        function addItemToCrafting(item) {
            if (selectedItems.length < 2) {
                selectedItems.push(item);

                const slot = document.createElement('div');
                slot.textContent = item;
                slot.classList.add('item');
                slot.dataset.item = item; // Add data-item attribute
                slot.addEventListener('click', removeItem); // Add click event listener
                craftingSlots.appendChild(slot);

				if (selectedItems.length > 0) {
					let counts = {};
					selectedItems.forEach(function(x) {
						counts[x] = (counts[x] || 0) + 1;
					});

					for (let item in counts) {
						if (counts[item] > 2) {
							alert("You can only have up to 2 of the same item.");
							selectedItems.pop(); //remove last item
							slot.remove();
							return;
						}
					}
				}

			} else {
				alert('Only two items can be crafted at a time.');
			}
        }

		function drop(event) {
			event.preventDefault();
			const item = event.dataTransfer.getData('text');
            addItemToCrafting(item);
		}

        function clickToMove(event) {
            const item = event.target.dataset.item;
            addItemToCrafting(item);
        }

		// Recipe List
		const recipes = {};

		function removeItem(event) {
			const itemToRemove = event.target.dataset.item;
			const index = selectedItems.indexOf(itemToRemove);
			if (index > -1) {
				selectedItems.splice(index, 1);
			}
			event.target.remove(); // Remove the item from the crafting slots
		}

        function craft() {
            if (selectedItems.length === 2) {
               // Sort the items so the order doesn't matter in the recipe
                selectedItems.sort();
                const recipeKey = selectedItems.join(',');
                

                if (recipes[recipeKey]) {
                    const result = recipes[recipeKey];
                    resultDiv.textContent = 'You crafted: ' + result;

					// Add crafted item to inventory
					addCraftedItemToInventory(result);

                } else {
                    resultDiv.textContent = 'No recipe found for these items.';
                }

                selectedItems = [];
                craftingSlots.innerHTML = ''; // Clear crafting slots
            } else {
                alert('Select two items to craft.');
            }
        }

		function addCraftedItemToInventory(result) {
			const newItem = document.createElement('div');
			newItem.classList.add('item');
			newItem.dataset.item = result.toLowerCase().replace(/ /g, ''); // Use lowercase for data-item
			newItem.draggable = true;
			newItem.textContent = result;

			// Add a span for removing the item
			const removeItemSpan = document.createElement('span');
			removeItemSpan.classList.add('remove-item');
			removeItemSpan.textContent = ' x'; // Display 'x' to indicate removal
			newItem.appendChild(removeItemSpan);

			inventory.appendChild(newItem);

			// Add event listener to the new item so it can be dragged
			newItem.addEventListener('dragstart', dragStart);

			// Add event listener to remove item from inventory
			removeItemSpan.addEventListener('click', function(event) {
				event.stopPropagation(); // Prevent item dragging when clicking 'x'
				newItem.remove();
			});
		}

		function craftAll() {
			for (const recipeKey in recipes) {
				const result = recipes[recipeKey];
				addCraftedItemToInventory(result);
			}
		}

		function addRecipe() {
			const item1 = item1Input.value.toLowerCase();
			const item2 = item2Input.value.toLowerCase();
			const result = resultItemInput.value;

			if (item1 && item2 && result) {
				const recipeKey1 = [item1, item2].sort().join(',');
				recipes[recipeKey1] = result;

				const recipeKey2 = [item2, item1].sort().join(',');
				recipes[recipeKey2] = result;

				updateRecipeList();

				alert('Recipe added!');
				item1Input.value = '';
				item2Input.value = '';
				resultItemInput.value = '';
			} else {
				alert('Please fill in all fields to add a recipe.');
			}
		}

		function updateRecipeList() {
            recipeListDiv.innerHTML = ''; // Clear the existing list

            if (Object.keys(recipes).length === 0) {
                recipeListDiv.innerHTML = '<p>No recipes added yet.</p>';
                return;
            }

            const ul = document.createElement('ul');
            for (const recipeKey in recipes) {
                const items = recipeKey.split(',');
                const result = recipes[recipeKey];

                const li = document.createElement('li');
                li.classList.add('recipe-item');
                li.innerHTML = `
                    <span>${items[0]} + ${items[1]} = ${result}</span>
                    <button onclick="removeRecipe('${recipeKey}')">Remove</button>
                `;
                ul.appendChild(li);
            }

            recipeListDiv.appendChild(ul);
        }

		function removeRecipe(recipeKey) {
            delete recipes[recipeKey];
            const items = recipeKey.split(',');
            const recipeKey2 = [items[1], items[0]].sort().join(',');
            delete recipes[recipeKey2]; // Remove the reversed recipe as well
            updateRecipeList();
        }
		
		function exportRecipes() {
			const filename = exportFilenameInput.value || 'recipes'; // Use input value or default
            const json = JSON.stringify(recipes);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importRecipes() {
            const fileInput = document.getElementById('importFile');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const importedRecipes = JSON.parse(event.target.result);
                        // Clear existing recipes before importing
						for (let key in recipes) {
							if (recipes.hasOwnProperty(key)) {
								delete recipes[key];
							}
						}
                        Object.assign(recipes, importedRecipes);
                        updateRecipeList();
                        alert('Recipes imported successfully!');
                    } catch (error) {
                        alert('Error importing recipes: ' + error);
                    }
                };
                reader.readAsText(file);
            } else {
                alert('Please select a file to import.');
            }
        }
    </script>
</body>
</html>
