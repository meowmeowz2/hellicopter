<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subnautica 2D - Perfect Lighting Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .stat-bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.5); overflow: hidden; }
        .stat-fill { height: 100%; transition: width 0.3s ease; }
        .inventory-slot { width: 50px; height: 50px; background: rgba(20, 40, 60, 0.7); border: 2px solid rgba(0, 255, 255, 0.2); border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .inventory-slot.equipped { border-color: #0ff; background: rgba(0, 255, 255, 0.4); box-shadow: 0 0 10px rgba(0, 255, 255, 0.3); }
        .inventory-slot.edible { border-color: #fb0; box-shadow: 0 0 5px rgba(251, 176, 0, 0.2); }
        .inventory-slot.edible:hover { background: rgba(251, 176, 0, 0.3); }
        .equip-label { position: absolute; left: 60px; white-space: nowrap; font-size: 10px; color: rgba(0, 255, 255, 0.7); text-transform: uppercase; letter-spacing: 1px; pointer-events: none; }
        .crafting-btn { background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.4); color: #0ff; transition: all 0.2s; text-align: left; }
        .crafting-btn:hover:not(:disabled) { background: rgba(0, 255, 255, 0.3); }
        .crafting-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        
        #builder-menu { 
            position: absolute; bottom: 80px; left: 1rem; 
            background: rgba(10, 20, 30, 0.95); border: 1px solid #0ff; 
            padding: 10px; border-radius: 8px; display: none;
            max-height: 60vh; width: 220px; overflow-y: auto;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #0ff; border-radius: 10px; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer" class="flex flex-col justify-between p-4 text-white">
    <!-- Top Bar: Stats -->
    <div class="flex flex-col gap-2 w-64">
        <div>
            <div class="flex justify-between text-[10px] mb-1"><span>HEALTH</span><span id="health-val">100</span></div>
            <div class="stat-bar"><div id="health-bar" class="stat-fill bg-red-500" style="width: 100%"></div></div>
        </div>
        <div>
            <div class="flex justify-between text-[10px] mb-1"><span>HUNGER</span><span id="hunger-val">100</span></div>
            <div class="stat-bar"><div id="hunger-bar" class="stat-fill bg-orange-400" style="width: 100%"></div></div>
        </div>
        <div>
            <div class="flex justify-between text-[10px] mb-1"><span>OXYGEN</span><span id="o2-val">45s</span></div>
            <div class="stat-bar"><div id="o2-bar" class="stat-fill bg-blue-400" style="width: 100%"></div></div>
        </div>
    </div>

    <!-- Equipment & Tools Slot -->
    <div class="absolute left-4 top-40 flex flex-col gap-4">
        <div class="text-[10px] text-cyan-500/50 uppercase tracking-widest font-bold mb-1">Equipment</div>
        <div id="equipment-panel" class="flex flex-col gap-3 pointer-events-auto"></div>
        <div class="text-[10px] text-cyan-500/50 uppercase tracking-widest font-bold mt-2">Tools</div>
        <div id="tools-panel" class="flex flex-col gap-3 pointer-events-auto"></div>
    </div>

    <!-- Builder Menu -->
    <div id="builder-menu" class="pointer-events-auto">
        <div class="text-[10px] text-cyan-400 font-bold mb-2 uppercase border-b border-cyan-900 pb-1">Habitat Designer</div>
        <div id="build-options" class="flex flex-col gap-2"></div>
    </div>

    <!-- Builder Icon -->
    <div class="absolute bottom-4 left-4 pointer-events-auto">
        <div onclick="toggleBuilderMenu()" class="inventory-slot border-purple-500 bg-purple-900/40 hover:bg-purple-800/60" title="Habitat Builder">
            <span style="color:#a0f; font-weight: bold;">HB</span>
        </div>
    </div>

    <!-- Center Message -->
    <div id="msg" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-cyan-300 font-bold text-xl opacity-0 transition-opacity pointer-events-none text-center"></div>

    <!-- Bottom: Inventory -->
    <div class="flex flex-col items-center gap-4">
        <div id="depth-indicator" class="text-2xl font-mono text-cyan-400">DEPTH: 0m</div>
        <div class="text-[10px] text-cyan-500/50 uppercase tracking-widest">Inventory (Press 'B' for Creative)</div>
        <div class="flex gap-2 pointer-events-auto" id="inventory"></div>
    </div>

    <!-- Right Side: Fabricator -->
    <div class="absolute right-4 top-4 w-56 pointer-events-auto bg-slate-900/90 p-4 rounded-lg border border-cyan-500/30 max-h-[70vh] overflow-y-auto">
        <h3 class="text-cyan-400 font-bold mb-3 border-b border-cyan-500/30 pb-1">FABRICATOR</h3>
        <div id="crafting-list" class="flex flex-col gap-2 text-sm"></div>
    </div>
</div>

<script>
/**
 * Subnautica 2D - V4.3 (Final Lighting Fix)
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
// Create a separate light canvas to prevent the "black hole" transparency bug
const lightCanvas = document.createElement('canvas');
const lctx = lightCanvas.getContext('2d');

const msgEl = document.getElementById('msg');
const builderMenu = document.getElementById('builder-menu');

const state = {
    player: {
        x: 0, y: -100, vx: 0, vy: 0, width: 20, height: 40, rotation: 0,
        baseSpeed: 0.15, speed: 0.15, friction: 0.94, 
        health: 100, hunger: 100,
        o2: 45, maxO2: 45, depth: 0, legPhase: 0, equipped: null,
        isInside: false, isInObservation: false
    },
    camera: { x: 0, y: 0 },
    mouse: { x: 0, y: 0, worldX: 0, worldY: 0 },
    inventory: { 'Titanium': 15, 'Copper': 5, 'Quartz': 10 }, 
    equipment: { tank: null, fins: null },
    resources: [],
    fish: [],
    baseParts: [],
    terrainPoints: [],
    lastTime: 0,
    keys: {},
    worldSize: { width: 15000, height: 8000 },
    activeBuilding: null,
    dayTime: 0.5,
    items: {
        'Titanium': { color: '#889', symbol: 'Ti', type: 'resource' },
        'Copper': { color: '#b87333', symbol: 'Cu', type: 'resource' },
        'Quartz': { color: '#eef', symbol: 'Qz', type: 'resource' },
        'Gold': { color: '#ffd700', symbol: 'Au', type: 'resource' },
        'Silver': { color: '#c0c0c0', symbol: 'Ag', type: 'resource' },
        'Lead': { color: '#4d5d53', symbol: 'Pb', type: 'resource' },
        'Raw Fish': { color: '#4af', symbol: '><>', type: 'resource' },
        'Cooked Fish': { color: '#fb0', symbol: '♨', type: 'food', nutrition: 35 },
        'Nutrient Block': { color: '#ff9', symbol: '■', type: 'food', nutrition: 75 },
        'Standard Tank': { color: '#fb0', symbol: 'O2', type: 'gear', slot: 'tank', o2: 90 },
        'High Capacity Tank': { color: '#f50', symbol: 'O2+', type: 'gear', slot: 'tank', o2: 180 },
        'Ultra High Capacity Tank': { color: '#f00', symbol: 'O2!', type: 'gear', slot: 'tank', o2: 360 },
        'Fins': { color: '#333', symbol: 'F', type: 'gear', slot: 'fins', speed: 0.22 },
        'Ultra Glide Fins': { color: '#0ff', symbol: 'F+', type: 'gear', slot: 'fins', speed: 0.32 },
        'Seaglide': { color: '#0f8', symbol: 'SG', type: 'tool' },
        'Flashlight': { color: '#ff0', symbol: 'FL', type: 'tool' },
        'Habitat Builder': { color: '#a0f', symbol: 'HB', type: 'tool' }
    },
    blueprints: [
        { id: 'cook', name: 'Cook Fish', cost: { 'Raw Fish': 1 }, crafted: false, repeat: true, effect: () => { 
            state.inventory['Cooked Fish'] = (state.inventory['Cooked Fish'] || 0) + 1; 
        } },
        { id: 'nutrient', name: 'Nutrient Block', cost: { 'Raw Fish': 2, 'Gold': 1 }, crafted: false, repeat: true, effect: () => { 
            state.inventory['Nutrient Block'] = (state.inventory['Nutrient Block'] || 0) + 1; 
        } },
        { id: 'tank1', name: 'Standard Tank', cost: { 'Titanium': 2 }, crafted: false, effect: () => { state.equipment.tank = 'Standard Tank'; applyGearEffects(); } },
        { id: 'tank2', name: 'High Capacity Tank', cost: { 'Titanium': 4, 'Quartz': 2, 'Silver': 1 }, crafted: false, unlock: 'tank1', effect: () => { state.equipment.tank = 'High Capacity Tank'; applyGearEffects(); } },
        { id: 'tank3', name: 'Ultra High Tank', cost: { 'Titanium': 6, 'Quartz': 4, 'Gold': 1 }, crafted: false, unlock: 'tank2', effect: () => { state.equipment.tank = 'Ultra High Capacity Tank'; applyGearEffects(); } },
        { id: 'fins1', name: 'Fins', cost: { 'Titanium': 1, 'Copper': 1 }, crafted: false, effect: () => { state.equipment.fins = 'Fins'; applyGearEffects(); } },
        { id: 'fins2', name: 'Ultra Glide Fins', cost: { 'Titanium': 2, 'Copper': 2, 'Silver': 1 }, crafted: false, unlock: 'fins1', effect: () => { state.equipment.fins = 'Ultra Glide Fins'; applyGearEffects(); } },
        { id: 'flashlight', name: 'Flashlight', cost: { 'Titanium': 1, 'Quartz': 1 }, crafted: false, effect: () => { state.inventory['Flashlight'] = 1; updateInventoryUI(); } },
        { id: 'seaglide', name: 'Seaglide', cost: { 'Copper': 2, 'Titanium': 1, 'Quartz': 1 }, crafted: false, effect: () => { state.inventory['Seaglide'] = 1; updateInventoryUI(); } },
    ],
    habitatPieces: [
        { name: 'Compartment', cost: { 'Titanium': 2 }, width: 120, height: 60, type: 'room' },
        { name: 'Multi-Purpose Room', cost: { 'Titanium': 6 }, width: 160, height: 140, type: 'room' },
        { name: 'Scanner Room', cost: { 'Titanium': 3, 'Copper': 2, 'Gold': 1 }, width: 130, height: 90, type: 'room_special' },
        { name: 'Bio-Reactor Module', cost: { 'Titanium': 4, 'Quartz': 2, 'Silver': 1 }, width: 100, height: 120, type: 'room_lab' },
        { name: 'Moonpool', cost: { 'Titanium': 8, 'Copper': 4, 'Lead': 2 }, width: 220, height: 100, type: 'room' },
        { name: 'Observation Bubble', cost: { 'Quartz': 4, 'Titanium': 1 }, width: 100, height: 100, type: 'bubble' },
        { name: 'Vertical Connector', cost: { 'Titanium': 2 }, width: 50, height: 140, type: 'room' },
        { name: 'Reinforced Window', cost: { 'Quartz': 2, 'Lead': 1 }, width: 45, height: 35, type: 'window' },
        { name: 'Reinforcement Plate', cost: { 'Titanium': 2, 'Lead': 2 }, width: 60, height: 60, type: 'plate' },
        { name: 'Floodlight', cost: { 'Titanium': 1, 'Quartz': 1 }, width: 20, height: 20, type: 'light' },
        { name: 'Solar Panel', cost: { 'Quartz': 2, 'Copper': 1 }, width: 40, height: 15, type: 'solar' },
        { name: 'Wall Planter', cost: { 'Titanium': 1 }, width: 30, height: 20, type: 'decoration' },
        { name: 'Storage Locker', cost: { 'Titanium': 2, 'Quartz': 1 }, width: 40, height: 60, type: 'locker' },
        { name: 'Internal Growbed', cost: { 'Titanium': 4 }, width: 100, height: 30, type: 'decoration' },
        { name: 'Foundation', cost: { 'Titanium': 4, 'Lead': 2 }, width: 280, height: 25, type: 'structure' }
    ]
};

function showMsg(text) {
    msgEl.innerText = text;
    msgEl.style.opacity = 1;
    setTimeout(() => msgEl.style.opacity = 0, 2000);
}

function applyGearEffects() {
    const p = state.player;
    p.maxO2 = state.equipment.tank ? state.items[state.equipment.tank].o2 : 45;
    p.baseSpeed = state.equipment.fins ? state.items[state.equipment.fins].speed : 0.15;
    updateInventoryUI();
}

function init() {
    resize();
    for (let x = -state.worldSize.width / 2; x <= state.worldSize.width / 2; x += 60) {
        let y = state.worldSize.height - 400 + Math.sin(x * 0.001) * 300 + Math.sin(x * 0.005) * 60;
        state.terrainPoints.push({ x, y });
    }
    for(let i=0; i<1200; i++) {
        state.resources.push({
            x: (Math.random() - 0.5) * state.worldSize.width,
            y: Math.random() * (state.worldSize.height - 800) + 200,
            type: ['Titanium', 'Copper', 'Quartz', 'Silver', 'Gold', 'Lead'][Math.floor(Math.pow(Math.random(), 1.5) * 6)],
        });
    }
    for(let i=0; i<400; i++) {
        state.fish.push({
            x: (Math.random() - 0.5) * state.worldSize.width,
            y: Math.random() * state.worldSize.height,
            vx: (Math.random() - 0.5) * 2.5,
            vy: (Math.random() - 0.5) * 1.5,
            size: 5 + Math.random() * 8,
            color: `hsl(${Math.random()*360}, 70%, 60%)`
        });
    }
    renderCrafting();
    renderBuildMenu();
    updateInventoryUI();
    window.requestAnimationFrame(gameLoop);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    lightCanvas.width = canvas.width;
    lightCanvas.height = canvas.height;
}

window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
    state.keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'b') {
        Object.keys(state.items).forEach(k => {
            if (state.items[k].type === 'resource' || state.items[k].type === 'food') {
                state.inventory[k] = 999;
            }
        });
        state.blueprints.forEach(bp => bp.crafted = true);
        state.equipment.tank = 'Ultra High Capacity Tank';
        state.equipment.fins = 'Ultra Glide Fins';
        state.inventory['Seaglide'] = 1;
        state.inventory['Flashlight'] = 1;
        state.player.equipped = 'Seaglide';
        applyGearEffects();
        updateInventoryUI();
        renderCrafting();
        showMsg("CREATIVE MODE ACTIVE: BEST GEAR & TOOLS UNLOCKED");
    }
});
window.addEventListener('keyup', e => state.keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
    state.mouse.x = e.clientX;
    state.mouse.y = e.clientY;
    state.mouse.worldX = e.clientX + state.camera.x;
    state.mouse.worldY = e.clientY + state.camera.y;
});

function toggleBuilderMenu() {
    builderMenu.style.display = (builderMenu.style.display === 'block') ? 'none' : 'block';
}

function selectBuildPiece(piece) {
    state.activeBuilding = piece;
    builderMenu.style.display = 'none';
    showMsg(`PLACING: ${piece.name.toUpperCase()}`);
}

function eatItem(itemName) {
    if (state.inventory[itemName] > 0) {
        state.inventory[itemName]--;
        state.player.hunger = Math.min(100, state.player.hunger + (state.items[itemName].nutrition || 20));
        showMsg("VITALS STABILIZED");
        updateInventoryUI();
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (!state.activeBuilding && state.player.isInside) {
        for (let bp of state.baseParts) {
            if (bp.type === 'locker') {
                if (Math.hypot(state.mouse.worldX - bp.x, state.mouse.worldY - bp.y) < 30) {
                    Object.keys(state.inventory).forEach(key => {
                        if (state.items[key].type === 'resource' && key !== 'Titanium') {
                            state.inventory[key] = 0;
                        }
                    });
                    showMsg("RESOURCES SECURED IN STORAGE");
                    updateInventoryUI();
                    return;
                }
            }
        }
    }

    if (state.activeBuilding) {
        const piece = state.activeBuilding;
        const canAfford = Object.keys(piece.cost).every(res => (state.inventory[res] || 0) >= piece.cost[res]);
        if (canAfford) {
            Object.entries(piece.cost).forEach(([res, amt]) => state.inventory[res] -= amt);
            state.baseParts.push({ 
                x: state.mouse.worldX, y: state.mouse.worldY, 
                name: piece.name, width: piece.width, height: piece.height, type: piece.type,
                rotation: 0,
                timer: 0
            });
            state.activeBuilding = null;
            updateInventoryUI();
            renderCrafting();
            showMsg("CONSTRUCTION COMPLETE");
        } else {
            showMsg("RESOURCES REQUIRED");
        }
    }
});

function update(dt) {
    const p = state.player;
    state.dayTime = (state.dayTime + dt/240000) % 1;

    p.speed = p.baseSpeed;
    if (p.equipped === 'Seaglide') p.speed *= 2.5;

    let ax = 0, ay = 0;
    if(state.keys['arrowup'] || state.keys['w']) ay -= p.speed;
    if(state.keys['arrowdown'] || state.keys['s']) ay += p.speed;
    if(state.keys['arrowleft'] || state.keys['a']) ax -= p.speed;
    if(state.keys['arrowright'] || state.keys['d']) ax += p.speed;

    p.vx += ax; p.vy += ay;
    p.vx *= p.friction; p.vy *= p.friction;
    p.x += p.vx; p.y += p.vy;

    const halfWidth = state.worldSize.width / 2;
    if (p.x < -halfWidth) { p.x = -halfWidth; p.vx = 0; }
    if (p.x > halfWidth) { p.x = halfWidth; p.vx = 0; }
    if (p.y < -500) p.y = -500;
    if (p.y > state.worldSize.height) p.y = state.worldSize.height;

    if (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1) {
        p.legPhase += dt * (p.equipped === 'Seaglide' ? 0.025 : 0.015);
        const targetRot = Math.atan2(p.vy, p.vx);
        let diff = targetRot - p.rotation;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        p.rotation += diff * 0.15;
    }

    let insideAny = false;
    let insideObs = false;
    let basePowerO2 = 0;

    state.baseParts.forEach(bp => {
        if (bp.type.startsWith('room') || bp.type === 'bubble') {
            if (Math.abs(p.x - bp.x) < bp.width/2 && Math.abs(p.y - bp.y) < bp.height/2) {
                insideAny = true;
                if (bp.type === 'bubble') insideObs = true;
            }
        }
        if (bp.type === 'solar') {
            const isDay = state.dayTime > 0.2 && state.dayTime < 0.8;
            if (isDay) basePowerO2 += 0.5 * Math.max(0, 1 - (bp.y / 1500));
        }
        if (bp.type === 'room_lab') basePowerO2 += 0.8;
        if (bp.name === 'Internal Growbed') {
            bp.timer += dt;
            if (bp.timer > 30000) { 
                bp.timer = 0;
                if (p.isInside && Math.hypot(p.x - bp.x, p.y - bp.y) < 60) {
                    state.inventory['Cooked Fish'] = (state.inventory['Cooked Fish'] || 0) + 1;
                    showMsg("FRUIT HARVESTED");
                    updateInventoryUI();
                }
            }
        }
    });
    
    p.isInside = insideAny;
    p.isInObservation = insideObs;
    p.depth = Math.max(0, Math.floor(p.y / 10));

    if (p.y < 0) {
        p.o2 = Math.min(p.maxO2, p.o2 + dt/10);
    } else if (p.isInside) {
        p.o2 = Math.min(p.maxO2, p.o2 + (basePowerO2 > 0.1 ? dt/8 : -dt/2000));
    } else {
        p.o2 -= dt/1000;
    }

    p.hunger -= dt/12000; 
    if (p.hunger < 0) { p.hunger = 0; p.health -= dt/200; }
    if (p.o2 <= 0) { p.o2 = 0; p.health -= dt/100; }
    if(p.health <= 0) {
        p.health = 100; p.o2 = p.maxO2; p.hunger = 100; p.x = 0; p.y = -100;
        showMsg("RECONSTRUCTION COMPLETE");
    }

    state.resources = state.resources.filter(r => {
        if(!p.isInside && Math.hypot(p.x - r.x, p.y - r.y) < 35) {
            state.inventory[r.type] = (state.inventory[r.type] || 0) + 1;
            updateInventoryUI(); renderCrafting(); return false;
        }
        return true;
    });

    state.fish = state.fish.filter(f => {
        f.x += f.vx; f.y += f.vy;
        if(f.x < -halfWidth || f.x > halfWidth) f.vx *= -1;
        if(f.y < 0 || f.y > state.worldSize.height) f.vy *= -1;
        if (!p.isInside && Math.hypot(p.x - f.x, p.y - f.y) < 30) {
            state.inventory['Raw Fish'] = (state.inventory['Raw Fish'] || 0) + 1;
            updateInventoryUI(); renderCrafting(); showMsg("SPECIMEN ACQUIRED"); return false;
        }
        return true;
    });

    state.camera.x += (p.x - canvas.width/2 - state.camera.x) * 0.1;
    state.camera.y += (p.y - canvas.height/2 - state.camera.y) * 0.1;
    updateUI();
}

function updateUI() {
    document.getElementById('health-bar').style.width = state.player.health + '%';
    document.getElementById('health-val').innerText = Math.ceil(state.player.health);
    document.getElementById('hunger-bar').style.width = state.player.hunger + '%';
    document.getElementById('hunger-val').innerText = Math.ceil(state.player.hunger);
    document.getElementById('o2-bar').style.width = (state.player.o2 / state.player.maxO2 * 100) + '%';
    document.getElementById('o2-val').innerText = Math.ceil(state.player.o2) + 's';
    document.getElementById('depth-indicator').innerText = state.player.isInside ? "HABITAT" : `DEPTH: ${state.player.depth}m`;
}

function updateInventoryUI() {
    const invEl = document.getElementById('inventory');
    invEl.innerHTML = '';
    Object.keys(state.inventory).forEach(key => {
        if (state.inventory[key] > 0 && state.items[key].type !== 'tool') {
            const item = state.items[key] || { color: '#fff', symbol: '?', type: 'misc' };
            const slot = document.createElement('div');
            slot.className = `inventory-slot ${item.type === 'food' ? 'edible' : ''}`;
            slot.innerHTML = `<span style="color:${item.color}">${item.symbol}</span>
                              <span class="absolute bottom-0 right-1 text-[10px] font-bold">${state.inventory[key]}</span>`;
            if (item.type === 'food') slot.onclick = () => eatItem(key);
            invEl.appendChild(slot);
        }
    });

    const equipEl = document.getElementById('equipment-panel');
    equipEl.innerHTML = '';
    ['tank', 'fins'].forEach(st => {
        const itemName = state.equipment[st];
        const slot = document.createElement('div');
        if (itemName) {
            const item = state.items[itemName];
            slot.className = 'inventory-slot equipped';
            slot.innerHTML = `<span style="color:${item.color}">${item.symbol}</span><div class="equip-label">${itemName}</div>`;
        } else {
            slot.className = 'inventory-slot opacity-20';
            slot.innerHTML = `<span class="text-[10px]">${st.toUpperCase()}</span>`;
        }
        equipEl.appendChild(slot);
    });

    const toolEl = document.getElementById('tools-panel');
    toolEl.innerHTML = '';
    ['Seaglide', 'Flashlight'].forEach(tool => {
        if (state.inventory[tool]) {
            const slot = document.createElement('div');
            slot.className = `inventory-slot ${state.player.equipped === tool ? 'equipped' : ''}`;
            slot.innerHTML = `<span style="color:${state.items[tool].color}">${state.items[tool].symbol}</span><div class="equip-label">${tool}</div>`;
            slot.onclick = () => { state.player.equipped = (state.player.equipped === tool ? null : tool); updateInventoryUI(); };
            toolEl.appendChild(slot);
        }
    });
}

function renderCrafting() {
    const list = document.getElementById('crafting-list');
    list.innerHTML = '';
    state.blueprints.forEach(bp => {
        if (bp.crafted && !bp.repeat) return;
        const canAfford = Object.keys(bp.cost).every(res => (state.inventory[res] || 0) >= bp.cost[res]);
        const btn = document.createElement('button');
        btn.className = `crafting-btn p-2 rounded flex flex-col`;
        btn.disabled = !canAfford;
        const costs = Object.entries(bp.cost).map(([r,a]) => `${a}${state.items[r]?.symbol || r}`).join(' ');
        btn.innerHTML = `<div class="font-bold">${bp.name}</div><div class="text-[9px] opacity-70">Cost: ${costs}</div>`;
        btn.onclick = () => {
            Object.entries(bp.cost).forEach(([res, amt]) => state.inventory[res] -= amt);
            bp.crafted = true; bp.effect(); updateInventoryUI(); renderCrafting();
            showMsg(`FABRICATED: ${bp.name}`);
        };
        list.appendChild(btn);
    });
}

function renderBuildMenu() {
    const list = document.getElementById('build-options');
    list.innerHTML = '';
    state.habitatPieces.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'crafting-btn p-2 rounded text-[11px]';
        let costStr = Object.entries(p.cost).map(([res, amt]) => `${amt}${state.items[res]?.symbol || res}`).join(' ');
        btn.innerHTML = `<div class="font-bold text-cyan-200">${p.name}</div><div class="opacity-70 text-[9px]">${costStr}</div>`;
        btn.onclick = () => selectBuildPiece(p);
        list.appendChild(btn);
    });
}

function drawPlayer() {
    const p = state.player;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);

    const legWave = Math.sin(p.legPhase) * 12;
    const bodyWave = Math.sin(p.legPhase * 0.5) * 3;

    // Fins
    ctx.fillStyle = state.equipment.fins ? (state.equipment.fins === 'Ultra Glide Fins' ? '#0ff' : '#333') : '#111';
    ctx.beginPath(); 
    ctx.moveTo(-18, -12 + legWave); ctx.lineTo(-30, -18 + legWave); ctx.lineTo(-30, -6 + legWave); ctx.fill();
    ctx.beginPath(); 
    ctx.moveTo(-18, 12 - legWave); ctx.lineTo(-30, 18 - legWave); ctx.lineTo(-30, 6 - legWave); ctx.fill();

    // Body
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.roundRect(-15, -10 + bodyWave, 28, 20, 6); ctx.fill();

    // Oxygen Tank
    const tN = state.equipment.tank;
    ctx.fillStyle = tN ? (tN.includes('Ultra') ? '#f00' : '#fb0') : '#444';
    ctx.beginPath(); ctx.roundRect(-12, -7 + bodyWave, 16, 14, 4); ctx.fill();

    // Helmet
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(14, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.beginPath(); ctx.arc(16, 0, 7, -Math.PI/2, Math.PI/2); ctx.fill();

    // Seaglide
    if (p.equipped === 'Seaglide') {
        ctx.fillStyle = '#0a0'; 
        ctx.beginPath(); ctx.roundRect(16, -10, 18, 20, 4); ctx.fill();
        ctx.fillStyle = '#0f8'; ctx.fillRect(18, -6, 14, 12);
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(32, 0, 3, 0, Math.PI*2); ctx.fill();
    } else if (p.equipped === 'Flashlight') {
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.roundRect(16, -4, 15, 8, 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(31, 0, 4, -Math.PI/2, Math.PI/2); ctx.fill();
    }

    ctx.restore();
}

function draw() {
    ctx.clearRect(0,0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-state.camera.x, -state.camera.y);

    const isInside = state.player.isInside;
    const isInsideObs = state.player.isInObservation;

    // Sky & Background (only if not inside or if in observation)
    if (!isInside || isInsideObs) {
        const skyGrad = ctx.createLinearGradient(0, -600, 0, 0);
        skyGrad.addColorStop(0, '#87ceeb'); skyGrad.addColorStop(1, '#e0f7ff');
        ctx.fillStyle = skyGrad; ctx.fillRect(-state.worldSize.width/2, -600, state.worldSize.width, 600);

        const seaGrad = ctx.createLinearGradient(0, 0, 0, state.worldSize.height);
        seaGrad.addColorStop(0, '#1166bb'); seaGrad.addColorStop(0.1, '#004488'); seaGrad.addColorStop(1, '#000408');
        ctx.fillStyle = seaGrad; ctx.fillRect(-state.worldSize.width/2, 0, state.worldSize.width, state.worldSize.height);
        
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.moveTo(state.terrainPoints[0].x, state.worldSize.height);
        state.terrainPoints.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(state.terrainPoints[state.terrainPoints.length-1].x, state.worldSize.height); ctx.fill();

        state.fish.forEach(f => {
            ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(Math.atan2(f.vy, f.vx));
            ctx.fillStyle = f.color; ctx.beginPath(); ctx.ellipse(0, 0, f.size, f.size/2, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        });

        state.resources.forEach(r => {
            ctx.fillStyle = state.items[r.type]?.color || '#fff';
            ctx.beginPath(); ctx.arc(r.x, r.y, 6, 0, Math.PI*2); ctx.fill();
        });
    } else {
        ctx.fillStyle = '#050a10'; ctx.fillRect(state.camera.x, state.camera.y, canvas.width, canvas.height);
    }

    // Base Parts
    state.baseParts.forEach(bp => {
        ctx.lineWidth = 3; ctx.strokeStyle = '#0ff'; ctx.fillStyle = '#1e242e';
        if (bp.type.startsWith('room')) {
            ctx.beginPath(); ctx.roundRect(bp.x - bp.width/2, bp.y - bp.height/2, bp.width, bp.height, bp.name.includes('Multi') ? 40 : 8); ctx.fill(); ctx.stroke();
        } else if (bp.type === 'bubble') {
            ctx.fillStyle = 'rgba(20, 60, 100, 0.4)';
            ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.width/2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        } else if (bp.type === 'solar') {
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(bp.x - bp.width/2, bp.y - bp.height/2, bp.width, bp.height, 2); ctx.fill();
        } else if (bp.type === 'locker') {
            ctx.fillStyle = '#444'; ctx.beginPath(); ctx.roundRect(bp.x - bp.width/2, bp.y - bp.height/2, bp.width, bp.height, 2); ctx.fill();
        } else if (bp.type === 'light') {
            ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(bp.x, bp.y, 4, 0, Math.PI*2); ctx.fill();
        }
    });

    drawPlayer();
    ctx.restore(); 

    // Lighting Pass - MULTI-STEP TO PREVENT BLACK HOLES
    const depthAlpha = Math.min(0.9, state.player.depth / 800);
    const timeFactor = Math.sin(state.dayTime * Math.PI * 2);
    const dayAlpha = Math.max(0, 0.4 - timeFactor * 0.4);
    const finalOverlayAlpha = Math.max(dayAlpha, depthAlpha);

    if (finalOverlayAlpha > 0.05) {
        // 1. Clear the light buffer
        lctx.clearRect(0, 0, lightCanvas.width, lightCanvas.height);
        
        // 2. Fill it with the ambient darkness
        lctx.fillStyle = `rgba(0, 0, 15, ${finalOverlayAlpha})`;
        lctx.fillRect(0, 0, lightCanvas.width, lightCanvas.height);

        // 3. "Punch holes" in the darkness using destination-out on the LIGHT CANVAS ONLY
        lctx.save();
        lctx.translate(-state.camera.x, -state.camera.y);
        lctx.globalCompositeOperation = 'destination-out';

        // Player Light (Flashlight / Seaglide)
        if (state.player.equipped) {
            const p = state.player;
            const radius = p.equipped === 'Seaglide' ? 500 : 350;
            const angleWidth = p.equipped === 'Seaglide' ? 0.4 : 0.7;
            const grad = lctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, radius);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            lctx.fillStyle = grad;
            lctx.beginPath(); 
            lctx.moveTo(p.x, p.y);
            lctx.arc(p.x, p.y, radius, p.rotation - angleWidth, p.rotation + angleWidth);
            lctx.fill();
        }

        // Environment Lights
        state.baseParts.forEach(bp => {
            if (bp.type === 'light' || bp.type === 'room_lab') {
                const radius = bp.type === 'light' ? 300 : 180;
                const grad = lctx.createRadialGradient(bp.x, bp.y, 0, bp.x, bp.y, radius);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                lctx.fillStyle = grad; lctx.beginPath(); lctx.arc(bp.x, bp.y, radius, 0, Math.PI*2); lctx.fill();
            }
        });
        lctx.restore();

        // 4. Finally, draw the resulting darkness mask back onto the MAIN canvas
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(lightCanvas, 0, 0);
    }
}

function gameLoop(timestamp) {
    const dt = timestamp - state.lastTime;
    state.lastTime = timestamp;
    if(dt < 100) { update(dt); draw(); }
    window.requestAnimationFrame(gameLoop);
}

window.onload = init;
</script>
</body>
</html>
