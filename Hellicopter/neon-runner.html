<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Runner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #050505;
        font-family: 'Orbitron', 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        user-select: none;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #0a0a1a 0%, #050505 100%);
      }

      canvas {
        display: block;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 20;
        background: rgba(5, 5, 5, 0.85);
        backdrop-filter: blur(5px);
      }

      #ui-layer {
        position: absolute;
        top: 30px;
        left: 30px;
        pointer-events: none;
        z-index: 10;
        display: none;
        flex-direction: column;
        gap: 10px;
      }

      .menu-title {
        font-size: 64px;
        font-weight: bold;
        color: #00f2ff;
        text-shadow: 0 0 20px #00f2ff, 0 0 40px #00f2ff;
        margin-bottom: 20px;
        letter-spacing: 8px;
        text-align: center;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 320px;
      }

      .stat {
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #00f2ff;
        text-shadow: 0 0 10px #00f2ff;
      }

      #playground-ui {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        background: rgba(0, 0, 0, 0.85);
        padding: 15px 25px;
        border-radius: 12px;
        border: 2px solid #bd00ff;
        box-shadow: 0 0 20px rgba(189, 0, 255, 0.3);
        text-align: center;
        z-index: 15;
        pointer-events: auto;
        min-width: 250px;
      }

      .pg-save-row {
        margin-top: 10px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .pg-mini-btn {
        background: #1a0f24;
        border: 1px solid #bd00ff;
        color: #f4d3ff;
        padding: 6px 10px;
        border-radius: 6px;
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        cursor: pointer;
        text-transform: uppercase;
      }

      .pg-mini-btn:hover {
        background: #bd00ff;
        color: #111;
      }

      #playground-projects {
        display: none;
      }

      .project-list {
        width: 420px;
        max-height: 320px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0 8px;
      }

      .project-item {
        border: 1px solid rgba(189, 0, 255, 0.5);
        background: rgba(40, 10, 52, 0.45);
        border-radius: 8px;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .project-meta {
        font-size: 10px;
        opacity: 0.85;
      }

      .project-actions {
        display: flex;
        gap: 6px;
      }

      .menu-btn.small {
        font-size: 10px;
        padding: 8px 10px;
      }

      .pg-mode-indicator {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #bd00ff;
        text-transform: uppercase;
      }

      #custom-settings {
        display: none;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(189, 0, 255, 0.3);
        text-align: left;
      }

      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 11px;
        color: #ddd;
      }

      .setting-row input[type="range"] {
        width: 100px;
        accent-color: #bd00ff;
      }

      #flight-status {
        font-size: 14px;
        color: #bd00ff;
        text-shadow: 0 0 5px #bd00ff;
        display: none;
      }

      .bar-label {
        font-size: 10px;
        letter-spacing: 1px;
        margin-bottom: 2px;
        color: rgba(255, 255, 255, 0.7);
      }

      .cooldown-container {
        width: 180px;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #dash-bar {
        width: 100%;
        height: 100%;
        background: #00f2ff;
        box-shadow: 0 0 15px #00f2ff;
        transition: width 0.1s linear;
      }

      #grapple-bar {
        width: 100%;
        height: 100%;
        background: #bd00ff;
        box-shadow: 0 0 15px #bd00ff;
        transition: width 0.1s linear;
      }

      .menu-btn {
        background: transparent;
        border: 2px solid #00f2ff;
        color: #00f2ff;
        padding: 14px;
        font-size: 15px;
        font-weight: bold;
        font-family: 'Orbitron', sans-serif;
        border-radius: 5px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
        text-shadow: 0 0 10px #00f2ff;
        position: relative;
      }

      .menu-btn:hover {
        background: #00f2ff;
        color: #050505;
        box-shadow: 0 0 30px #00f2ff;
        transform: translateY(-3px);
      }

      .best-label {
        display: block;
        font-size: 9px;
        margin-top: 4px;
        opacity: 0.8;
        letter-spacing: 1px;
      }

      .menu-btn.easy { border-color: #00ff88; color: #00ff88; text-shadow: 0 0 10px #00ff88; }
      .menu-btn.easy:hover { background: #00ff88; color: #050505; box-shadow: 0 0 30px #00ff88; }

      .menu-btn.hard { border-color: #ff0055; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
      .menu-btn.hard:hover { background: #ff0055; color: #fff; box-shadow: 0 0 30px #ff0055; }

      .menu-btn.master { border-color: #ffaa00; color: #ffaa00; text-shadow: 0 0 15px #ffaa00; border-width: 3px; }
      .menu-btn.master:hover { background: #ffaa00; color: #000; box-shadow: 0 0 40px #ffaa00; }

      .menu-btn.playground { border-color: #bd00ff; color: #bd00ff; text-shadow: 0 0 10px #bd00ff; margin-top: 10px; }
      .menu-btn.playground:hover { background: #bd00ff; color: #fff; box-shadow: 0 0 30px #bd00ff; }

      #game-over-screen { display: none; }

      .controls-hint {
        position: absolute;
        bottom: 30px;
        width: 100%;
        text-align: center;
        color: #00f2ff;
        opacity: 0.6;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        z-index: 5;
      }

      .difficulty-indicator {
        position: absolute;
        top: 30px;
        right: 30px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 5px 15px;
        border-radius: 20px;
        border: 1px solid #00f2ff;
        color: #00f2ff;
        display: none;
      }

      #highscore-notif {
        color: #fff;
        font-size: 14px;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        animation: pulse 1s infinite alternate;
        display: none;
      }

      #sim-selector {
        background: #111;
        color: #bd00ff;
        border: 1px solid #bd00ff;
        padding: 5px 10px;
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        margin-top: 5px;
        cursor: pointer;
        border-radius: 4px;
        outline: none;
      }

      @keyframes pulse {
        from { opacity: 0.4; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>

      <div id="ui-layer">
        <div class="stat" id="dist-label">DIST: <span id="distance">0</span></div>
        <div id="flight-status">FLIGHT CORE: <span id="flight-toggle-text">OFF</span></div>
        <div id="cooldown-bars">
          <div>
            <div class="bar-label">DASH / BLINK</div>
            <div class="cooldown-container"><div id="dash-bar"></div></div>
          </div>
          <div>
            <div class="bar-label">GRAPPLE</div>
            <div class="cooldown-container"><div id="grapple-bar"></div></div>
          </div>
        </div>
      </div>

      <!-- Playground UI -->
      <div id="playground-ui">
        <div id="pg-status-text" class="pg-mode-indicator">MODE: EDITING</div>
        <div style="font-size: 10px; color: #aaa; margin-bottom: 5px;">
            SIMULATOR PROTOCOL:
            <select id="sim-selector" onchange="updateSimDifficulty(this.value)">
                <option value="normal">Standard</option>
                <option value="easy">Easy</option>
                <option value="hard">Hard</option>
                <option value="master">Master</option>
                <option value="custom">-- CUSTOM --</option>
            </select>
        </div>
        
        <div id="custom-settings">
            <div class="setting-row">
                <span>Gravity</span>
                <input type="range" id="cfg-gravity" min="0.1" max="1.5" step="0.05" value="0.45">
            </div>
            <div class="setting-row">
                <span>Jump Power</span>
                <input type="range" id="cfg-jump" min="5" max="25" step="1" value="10.5">
            </div>
            <div class="setting-row">
                <span>Max Jumps</span>
                <input type="range" id="cfg-jumps-count" min="1" max="10" step="1" value="2">
            </div>
            <div class="setting-row">
                <span>Dash Force</span>
                <input type="range" id="cfg-dash" min="10" max="60" step="2" value="24">
            </div>
        </div>

        <div class="pg-save-row">
            <button id="pg-save-project" class="pg-mini-btn">Save Snapshot</button>
            <button id="pg-projects-btn" class="pg-mini-btn">Projects</button>
        </div>
      </div>

      <div id="playground-projects" class="overlay">
        <div class="menu-title" style="font-size:40px; margin-bottom: 8px; color:#bd00ff; text-shadow: 0 0 20px #bd00ff;">PLAYGROUND<br/>PROJECTS</div>
        <div class="project-list" id="project-list"></div>
        <div class="button-group" style="width:420px;">
          <button class="menu-btn playground" onclick="createNewPlaygroundProject()">New Empty Project</button>
          <button class="menu-btn" onclick="closeProjectSelection()">Back</button>
        </div>
      </div>

      <div id="diff-tag" class="difficulty-indicator">NORMAL</div>

      <div id="main-menu" class="overlay">
        <div class="menu-title">NEON<br />RUNNER</div>
        <div class="button-group">
          <button class="menu-btn easy" onclick="startGame('easy')">
            Easy Protocol
            <span class="best-label">Best: <span id="best-easy">0</span></span>
          </button>
          <button class="menu-btn" onclick="startGame('normal')">
            Standard Protocol
            <span class="best-label">Best: <span id="best-normal">0</span></span>
          </button>
          <button class="menu-btn hard" onclick="startGame('hard')">
            Hard Protocol
            <span class="best-label">Best: <span id="best-hard">0</span></span>
          </button>
          <button class="menu-btn master" onclick="startGame('master')">
            Master Protocol
            <span class="best-label">Best: <span id="best-master">0</span></span>
          </button>
          <button class="menu-btn playground" onclick="openPlaygroundProjects()">
            Playground Mode
            <span class="best-label">Sandbox / Build</span>
          </button>
        </div>
      </div>

      <div id="game-over-screen" class="overlay">
        <h1 id="death-msg" style="color: #ff0055; text-shadow: 0 0 20px #ff0055">SYSTEM CRITICAL</h1>
        <div style="font-size: 32px; margin: 10px 0; color: #00f2ff" id="score-text">Distance: <span id="final-score">0</span></div>
        <div id="highscore-notif">NEW RECORD DETECTED</div>
        <div style="font-size: 14px; margin-bottom: 30px; opacity: 0.7;" id="prev-best-text">Protocol Record: <span id="record-score">0</span></div>
        <div class="button-group">
          <button id="retry-btn" class="menu-btn" onclick="restartGame()">Reboot</button>
          <button class="menu-btn" onclick="backToMenu()">Main Menu</button>
        </div>
      </div>

      <div id="hint-text" class="controls-hint">
        WAD Move • S Blink • Space Jump • Shift Dash • E Grapple
      </div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const distEl = document.getElementById('distance');
      const distLabel = document.getElementById('dist-label');
      const scoreText = document.getElementById('score-text');
      const dashBarEl = document.getElementById('dash-bar');
      const grappleBarEl = document.getElementById('grapple-bar');
      const mainMenu = document.getElementById('main-menu');
      const gameOverMenu = document.getElementById('game-over-screen');
      const hud = document.getElementById('ui-layer');
      const finalScoreEl = document.getElementById('final-score');
      const diffTag = document.getElementById('diff-tag');
      const highscoreNotif = document.getElementById('highscore-notif');
      const recordScoreEl = document.getElementById('record-score');
      const hintText = document.getElementById('hint-text');
      const flightStatus = document.getElementById('flight-status');
      const flightToggleText = document.getElementById('flight-toggle-text');
      const pgUI = document.getElementById('playground-ui');
      const pgStatusText = document.getElementById('pg-status-text');
      const customSettingsPanel = document.getElementById('custom-settings');
      const projectSelector = document.getElementById('playground-projects');
      const projectListEl = document.getElementById('project-list');

      // --- PERSISTENCE ---
      const highscores = {
        easy: parseInt(localStorage.getItem('neon_runner_easy')) || 0,
        normal: parseInt(localStorage.getItem('neon_runner_normal')) || 0,
        hard: parseInt(localStorage.getItem('neon_runner_hard')) || 0,
        master: parseInt(localStorage.getItem('neon_runner_master')) || 0,
      };

      function updateMenuScores() {
        document.getElementById('best-easy').innerText = highscores.easy;
        document.getElementById('best-normal').innerText = highscores.normal;
        document.getElementById('best-hard').innerText = highscores.hard;
        document.getElementById('best-master').innerText = highscores.master;
      }
      updateMenuScores();

      function saveScore(diff, score) {
        if (diff === 'playground') return false;
        if (score > highscores[diff]) {
          highscores[diff] = score;
          localStorage.setItem(`neon_runner_${diff}`, score);
          return true;
        }
        return false;
      }

      const PLAYGROUND_PROJECTS_KEY = 'neon_runner_playground_projects_v2';
      let playgroundProjects = [];
      let activeProjectId = null;

      function getProjectPayload() {
        return {
          platforms: platforms.map((p) => ({ x: p.x, y: p.y, width: p.width, height: p.height })),
          simDifficulty,
          custom: {
            gravity: CONFIG.gravity.custom,
            jump: -CONFIG.jumpForce.custom,
            jumps: CONFIG.maxJumps.custom,
            dash: CONFIG.dashForce.custom,
          },
        };
      }

      function persistPlaygroundProjects() {
        localStorage.setItem(PLAYGROUND_PROJECTS_KEY, JSON.stringify(playgroundProjects));
      }

      function loadProjectRegistry() {
        try {
          const raw = localStorage.getItem(PLAYGROUND_PROJECTS_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          playgroundProjects = Array.isArray(parsed) ? parsed : [];
        } catch {
          playgroundProjects = [];
        }
      }

      function applyProjectPayload(payload) {
        if (!payload) return;
        platforms = Array.isArray(payload.platforms)
          ? payload.platforms
              .filter((p) => typeof p.x === 'number' && typeof p.y === 'number' && typeof p.width === 'number' && typeof p.height === 'number')
              .map((p) => new Platform(p.x, p.y, p.width, p.height))
          : [];

        simDifficulty = payload.simDifficulty || 'normal';
        document.getElementById('sim-selector').value = simDifficulty;

        if (payload.custom) {
          if (typeof payload.custom.gravity === 'number') CONFIG.gravity.custom = payload.custom.gravity;
          if (typeof payload.custom.jump === 'number') CONFIG.jumpForce.custom = -Math.abs(payload.custom.jump);
          if (typeof payload.custom.jumps === 'number') CONFIG.maxJumps.custom = payload.custom.jumps;
          if (typeof payload.custom.dash === 'number') CONFIG.dashForce.custom = payload.custom.dash;
        }

        document.getElementById('cfg-gravity').value = CONFIG.gravity.custom;
        document.getElementById('cfg-jump').value = Math.abs(CONFIG.jumpForce.custom);
        document.getElementById('cfg-jumps-count').value = CONFIG.maxJumps.custom;
        document.getElementById('cfg-dash').value = CONFIG.dashForce.custom;
        customSettingsPanel.style.display = (simDifficulty === 'custom') ? 'block' : 'none';
      }

      function createProjectSnapshot({ cloneCurrent = true } = {}) {
        const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const project = {
          id,
          name: `Project ${playgroundProjects.length + 1}`,
          createdAt: Date.now(),
          payload: cloneCurrent
            ? getProjectPayload()
            : { platforms: [], simDifficulty: 'normal', custom: { gravity: 0.45, jump: 10.5, jumps: 2, dash: 24 } }
        };
        playgroundProjects.push(project);
        persistPlaygroundProjects();
        return project;
      }

      function saveToActiveProjectSnapshot() {
        if (difficulty !== 'playground' || gameState !== 'playing') return;
        const snapshot = createProjectSnapshot({ cloneCurrent: true });
        activeProjectId = snapshot.id;
      }

      function renderProjectList() {
        projectListEl.innerHTML = '';
        if (!playgroundProjects.length) {
          projectListEl.innerHTML = '<div class="project-item"><div>No projects yet. Create one to begin.</div></div>';
          return;
        }

        playgroundProjects
          .slice()
          .sort((a, b) => b.createdAt - a.createdAt)
          .forEach((project) => {
            const row = document.createElement('div');
            row.className = 'project-item';
            const date = new Date(project.createdAt || Date.now()).toLocaleString();
            row.innerHTML = `
              <div>
                <div>${project.name}</div>
                <div class="project-meta">${(project.payload?.platforms || []).length} platforms • ${date}</div>
              </div>
              <div class="project-actions">
                <button class="menu-btn small playground" data-action="open" data-id="${project.id}">Open</button>
                <button class="menu-btn small hard" data-action="delete" data-id="${project.id}">Delete</button>
              </div>
            `;
            projectListEl.appendChild(row);
          });
      }

      window.openPlaygroundProjects = function() {
        loadProjectRegistry();
        renderProjectList();
        mainMenu.style.display = 'none';
        gameOverMenu.style.display = 'none';
        projectSelector.style.display = 'flex';
      };

      window.closeProjectSelection = function() {
        projectSelector.style.display = 'none';
        mainMenu.style.display = 'flex';
      };

      window.createNewPlaygroundProject = function() {
        const created = createProjectSnapshot({ cloneCurrent: false });
        activeProjectId = created.id;
        startGame('playground');
      };

      projectListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const id = btn.dataset.id;
        if (btn.dataset.action === 'open') {
          activeProjectId = id;
          startGame('playground');
          return;
        }
        if (btn.dataset.action === 'delete') {
          playgroundProjects = playgroundProjects.filter((p) => p.id !== id);
          persistPlaygroundProjects();
          renderProjectList();
        }
      });

      // --- GAME SETTINGS ---
      let difficulty = 'normal';
      let simDifficulty = 'normal'; 
      let playgroundMode = 'edit'; 

      const CONFIG = {
        gravity: { easy: 0.35, normal: 0.45, hard: 0.65, master: 0.85, custom: 0.45 },
        wallSlideSpeed: 1.2,
        jumpForce: { easy: -11.5, normal: -10.5, hard: -10.5, master: -12.0, custom: -10.5 },
        blinkDistance: 120,
        moveAcceleration: 1.1,
        friction: 0.88,
        playerSize: 34,
        colors: {
          easy: '#00ff88',
          normal: '#00f2ff',
          hard: '#ff0055',
          master: '#ffaa00',
          custom: '#ffffff',
          playground: '#bd00ff',
          dash: '#ffffff',
          grapple: '#bd00ff',
          blink: '#ffff00',
        },
        maxJumps: { easy: 3, normal: 2, hard: 2, master: 2, custom: 2 },
        dashForce: { easy: 24, normal: 24, hard: 24, master: 24, custom: 24 },
        dashDuration: 10,
        dashCooldown: { easy: 25, normal: 45, hard: 60, master: 50, custom: 30 },
        grappleCooldown: 600,
        grappleRange: 650,
        grapplePropelForce: 1.45,
        maxGrappleVelocity: 35,
        trailLength: 15,
        cameraLerpX: 0.1,
        cameraLerpY: 0.08,
        deathZoneBuffer: 400,
      };

      let gameState = 'menu';
      let distance = 0;
      let scrollOffsetX = 0;
      let scrollOffsetY = 0;
      let canvasWidth, canvasHeight;
      let screenShake = 0;
      let particles = [];
      let shockwaves = [];
      let platforms = [];
      let nextPlatformX = 0;
      let isFlying = false;

      // Sandbox specific
      let dragStart = null;
      let currentDragBox = null;

      function resize() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const keys = {};
      const mouse = { active: false, x: 0, y: 0 };

      window.addEventListener('keydown', (e) => {
          keys[e.code] = true;
          if (difficulty === 'playground' && gameState === 'playing') {
              if (e.code === 'KeyF') {
                  isFlying = !isFlying;
                  flightToggleText.innerText = isFlying ? 'ON' : 'OFF';
                  shockwaves.push(new Shockwave(player.x + player.size/2, player.y + player.size/2, CONFIG.colors.playground));
              }
              if (e.code === 'KeyC') {
                  platforms = [];
                  shockwaves.push(new Shockwave(player.x + player.size/2, player.y + player.size/2, '#ff0000'));
              }
              if (e.code === 'KeyR') {
                  player.reset();
                  shockwaves.push(new Shockwave(player.x + player.size/2, player.y + player.size/2, '#00f2ff'));
              }
              if (e.code === 'KeyP') {
                  playgroundMode = playgroundMode === 'edit' ? 'play' : 'edit';
                  if (playgroundMode === 'play') {
                      isFlying = false;
                      pgStatusText.innerText = `MODE: TESTING (${simDifficulty.toUpperCase()})`;
                      pgStatusText.style.color = CONFIG.colors[simDifficulty];
                      shockwaves.push(new Shockwave(player.x + player.size/2, player.y + player.size/2, CONFIG.colors[simDifficulty]));
                  } else {
                      isFlying = true;
                      pgStatusText.innerText = `MODE: EDITING`;
                      pgStatusText.style.color = '#bd00ff';
                      shockwaves.push(new Shockwave(player.x + player.size/2, player.y + player.size/2, '#bd00ff'));
                  }
                  flightToggleText.innerText = isFlying ? 'ON' : 'OFF';
              }
          }
      });
      window.addEventListener('keyup', (e) => (keys[e.code] = false));

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        if (dragStart && difficulty === 'playground' && playgroundMode === 'edit') {
           const currentX = mouse.x + scrollOffsetX;
           const currentY = mouse.y + scrollOffsetY;
           currentDragBox = {
              x: Math.min(dragStart.x, currentX),
              y: Math.min(dragStart.y, currentY),
              w: Math.abs(dragStart.x - currentX),
              h: Math.abs(dragStart.y - currentY)
           };
        }
      });

      window.addEventListener('mousedown', (e) => {
        const worldX = mouse.x + scrollOffsetX;
        const worldY = mouse.y + scrollOffsetY;
        if (difficulty === 'playground' && gameState === 'playing' && playgroundMode === 'edit') {
            if (e.button === 0) dragStart = { x: worldX, y: worldY };
            else if (e.button === 2) {
                platforms = platforms.filter(p => {
                    const hit = worldX >= p.x && worldX <= p.x + p.width && worldY >= p.y && worldY <= p.y + p.height;
                    if (hit) shockwaves.push(new Shockwave(worldX, worldY, '#ff3333'));
                    return !hit;
                });
            }
        }
        mouse.active = true;
      });

      window.addEventListener('mouseup', (e) => {
        if (dragStart && difficulty === 'playground' && currentDragBox && playgroundMode === 'edit') {
            if (currentDragBox.w > 10 && currentDragBox.h > 10) {
                platforms.push(new Platform(currentDragBox.x, currentDragBox.y, currentDragBox.w, currentDragBox.h));
                shockwaves.push(new Shockwave(currentDragBox.x + currentDragBox.w/2, currentDragBox.y + currentDragBox.h/2, CONFIG.colors.playground));
            }
        }
        dragStart = null; currentDragBox = null; mouse.active = false;
      });

      window.addEventListener('contextmenu', (e) => e.preventDefault());

      window.updateSimDifficulty = function(val) {
        simDifficulty = val;
        customSettingsPanel.style.display = (val === 'custom') ? 'block' : 'none';
        if (playgroundMode === 'play') {
            pgStatusText.innerText = `MODE: TESTING (${simDifficulty.toUpperCase()})`;
            pgStatusText.style.color = CONFIG.colors[simDifficulty];
        }
      };

      // Custom Physics Listeners
      document.getElementById('cfg-gravity').addEventListener('input', (e) => { CONFIG.gravity.custom = parseFloat(e.target.value); });
      document.getElementById('cfg-jump').addEventListener('input', (e) => { CONFIG.jumpForce.custom = -parseFloat(e.target.value); });
      document.getElementById('cfg-jumps-count').addEventListener('input', (e) => { CONFIG.maxJumps.custom = parseInt(e.target.value); });
      document.getElementById('cfg-dash').addEventListener('input', (e) => { CONFIG.dashForce.custom = parseFloat(e.target.value); });

      document.getElementById('pg-save-project').addEventListener('click', () => {
        saveToActiveProjectSnapshot();
      });
      document.getElementById('pg-projects-btn').addEventListener('click', () => {
        backToMenu();
        openPlaygroundProjects();
      });

      function fillRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();
      }

      class Particle {
        constructor(x, y, vx, vy, color) {
          this.x = x; this.y = y; this.vx = vx; this.vy = vy;
          this.life = 1.0; this.color = color;
          this.size = Math.random() * 5 + 2;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.03; }
        draw() {
          ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color;
          ctx.fillRect(this.x - scrollOffsetX, this.y - scrollOffsetY, this.size, this.size);
          ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
        }
      }

      class Shockwave {
        constructor(x, y, color) {
          this.x = x; this.y = y; this.radius = 10; this.life = 1.0; this.color = color;
        }
        update() { this.radius += 10; this.life -= 0.04; }
        draw() {
          ctx.beginPath(); ctx.arc(this.x - scrollOffsetX, this.y - scrollOffsetY, this.radius, 0, Math.PI * 2);
          ctx.strokeStyle = this.color; ctx.globalAlpha = this.life; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = this.color;
          ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1.0;
        }
      }

      class Player {
        constructor() { this.size = CONFIG.playerSize; this.trail = []; this.reset(); }
        reset() {
          this.x = 100; this.y = canvasHeight / 2 - 100; this.vx = 0; this.vy = 0;
          this.grounded = false; this.onWall = false;
          const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
          this.jumpsLeft = CONFIG.maxJumps[currentDiff];
          this.facingRight = true; this.dashTimer = 0; this.dashCooldownTimer = 0;
          this.grappleCooldownTimer = 0; this.isGrappling = false; this.grappleTarget = null;
          this.canDash = true; this.trail = []; this.blinkKeyWasDown = false;
        }
        createEffect(color, amount = 15) {
          const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
          screenShake = currentDiff === 'master' ? 30 : currentDiff === 'hard' ? 20 : 12;
          shockwaves.push(new Shockwave(this.x + this.size / 2, this.y + this.size / 2, color));
          for (let i = 0; i < amount; i++) {
            particles.push(new Particle(this.x + this.size / 2, this.y + this.size / 2, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, color));
          }
        }
        update() {
          const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
          if (this.dashTimer > 0) { this.dashTimer--; if (!isFlying) this.vy = 0; }
          if (this.dashCooldownTimer > 0) this.dashCooldownTimer--;
          if (this.grappleCooldownTimer > 0) this.grappleCooldownTimer--;

          const dashPercent = 1 - this.dashCooldownTimer / CONFIG.dashCooldown[currentDiff];
          dashBarEl.style.width = `${Math.max(0, dashPercent * 100)}%`;
          dashBarEl.style.backgroundColor = dashPercent >= 1 ? CONFIG.colors[currentDiff] : '#444';

          const grapplePercent = 1 - this.grappleCooldownTimer / CONFIG.grappleCooldown;
          grappleBarEl.style.width = `${Math.max(0, grapplePercent * 100)}%`;
          grappleBarEl.style.backgroundColor = grapplePercent >= 1 ? CONFIG.colors.grapple : '#444';

          const grapplePressed = keys['KeyE'];
          if (grapplePressed && (this.grappleCooldownTimer <= 0 || difficulty === 'playground') && !this.isGrappling) {
            let nearest = null; let minDist = CONFIG.grappleRange;
            platforms.forEach((p) => {
              const dx = p.x + p.width / 2 - (this.x + this.size / 2); const dy = p.y - (this.y + this.size / 2);
              const d = Math.sqrt(dx * dx + dy * dy);
              if (d < minDist && dx > -100) { minDist = d; nearest = p; }
            });
            if (nearest) {
              this.isGrappling = true; this.grappleTarget = nearest;
              if (difficulty !== 'playground' || playgroundMode === 'play') this.grappleCooldownTimer = CONFIG.grappleCooldown;
              this.jumpsLeft = CONFIG.maxJumps[currentDiff];
              shockwaves.push(new Shockwave(this.x + this.size / 2, this.y + this.size / 2, CONFIG.colors.grapple));
            }
          }

          if (this.isGrappling && this.grappleTarget) {
            const tx = this.grappleTarget.x + this.grappleTarget.width / 2; const ty = this.grappleTarget.y;
            const dx = tx - (this.x + this.size / 2); const dy = ty - (this.y + this.size / 2);
            const dist = Math.sqrt(dx * dx + dy * dy);
            this.vx += (dx / dist) * CONFIG.grapplePropelForce; this.vy += (dy / dist) * CONFIG.grapplePropelForce;
            const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            if (speed > CONFIG.maxGrappleVelocity) { this.vx = (this.vx / speed) * CONFIG.maxGrappleVelocity; this.vy = (this.vy / speed) * CONFIG.maxGrappleVelocity; }
            if (dist < 40 || !grapplePressed) { this.isGrappling = false; this.grappleTarget = null; }
          }

          if (this.dashTimer <= 0) {
            const moveMult = (this.isGrappling || (isFlying && !this.grounded)) ? 0.3 : 1;
            const accel = isFlying ? 2.5 : CONFIG.moveAcceleration;
            if (keys['ArrowLeft'] || keys['KeyA']) { this.vx -= accel * moveMult; this.facingRight = false; }
            if (keys['ArrowRight'] || keys['KeyD']) { this.vx += accel * moveMult; this.facingRight = true; }
            if (isFlying) {
                if (keys['ArrowUp'] || keys['KeyW']) this.vy -= accel;
                if (keys['ArrowDown'] || keys['KeyS']) this.vy += accel;
            }
            if ((keys['ArrowDown'] || keys['KeyS']) && !isFlying) {
              if (!this.blinkKeyWasDown && this.dashCooldownTimer <= 0) {
                this.createEffect(CONFIG.colors.blink, 20);
                this.x += CONFIG.blinkDistance * (this.vx >= 0 ? 1 : -1);
                this.dashCooldownTimer = CONFIG.dashCooldown[currentDiff];
                this.createEffect(CONFIG.colors.blink, 10);
              }
              this.blinkKeyWasDown = true;
            } else this.blinkKeyWasDown = false;

            if (keys['ArrowUp'] || keys['KeyW'] || keys['Space']) {
              if (!this.jumpKeyPressed) {
                if (this.grounded || this.onWall) {
                  this.vy = CONFIG.jumpForce[currentDiff]; this.grounded = false; this.onWall = false;
                  this.jumpsLeft = CONFIG.maxJumps[currentDiff] - 1;
                } else if (this.jumpsLeft > 0 && !isFlying) {
                  this.vy = CONFIG.jumpForce[currentDiff] * 0.95; this.jumpsLeft--;
                  shockwaves.push(new Shockwave(this.x + this.size / 2, this.y + this.size, CONFIG.colors[currentDiff]));
                }
              }
              this.jumpKeyPressed = true;
            } else this.jumpKeyPressed = false;

            if ((keys['ShiftLeft'] || keys['KeyL']) && this.canDash && (this.dashCooldownTimer <= 0 || (difficulty === 'playground' && playgroundMode === 'edit'))) {
              this.dashTimer = CONFIG.dashDuration; this.dashCooldownTimer = CONFIG.dashCooldown[currentDiff];
              this.vx = this.facingRight ? CONFIG.dashForce[currentDiff] : -CONFIG.dashForce[currentDiff];
              if (!isFlying) this.vy = 0; this.canDash = false; this.jumpsLeft = CONFIG.maxJumps[currentDiff];
              this.createEffect(CONFIG.colors.dash);
            }
            if (!this.isGrappling) {
              if (this.onWall && this.vy > 0) this.vy = CONFIG.wallSlideSpeed;
              else if (!isFlying) this.vy += CONFIG.gravity[currentDiff];
              this.vx *= CONFIG.friction; if (isFlying) this.vy *= CONFIG.friction;
            }
          }
          this.prevX = this.x; this.prevY = this.y; this.x += this.vx; this.y += this.vy;
          if (this.x < 0) this.x = 0;
          if (this.y > scrollOffsetY + canvasHeight + CONFIG.deathZoneBuffer && difficulty !== 'playground') endGame();
          this.trail.unshift({ x: this.x, y: this.y, color: this.dashTimer > 0 ? CONFIG.colors.dash : CONFIG.colors[currentDiff] });
          if (this.trail.length > CONFIG.trailLength) this.trail.pop();
          this.grounded = false; this.onWall = false;
        }
        draw() {
          const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
          if (this.isGrappling && this.grappleTarget) {
            ctx.beginPath(); ctx.moveTo(this.x + this.size / 2 - scrollOffsetX, this.y + this.size / 2 - scrollOffsetY);
            ctx.lineTo(this.grappleTarget.x + this.grappleTarget.width / 2 - scrollOffsetX, this.grappleTarget.y - scrollOffsetY);
            ctx.strokeStyle = CONFIG.colors.grapple; ctx.lineWidth = 3; ctx.setLineDash([10, 5]); ctx.stroke(); ctx.setLineDash([]);
          }
          this.trail.forEach((pos, index) => {
            ctx.fillStyle = pos.color; ctx.globalAlpha = (1 - index / CONFIG.trailLength) * 0.35;
            fillRoundedRect(pos.x - scrollOffsetX, pos.y - scrollOffsetY, this.size, this.size, 8);
          });
          ctx.globalAlpha = 1.0;
          const mainColor = this.dashTimer > 0 ? CONFIG.colors.dash : CONFIG.colors[currentDiff];
          ctx.shadowBlur = 20; ctx.shadowColor = mainColor; ctx.fillStyle = mainColor;
          fillRoundedRect(this.x - scrollOffsetX, this.y - scrollOffsetY, this.size, this.size, 8);
          ctx.shadowBlur = 0; ctx.fillStyle = '#050505';
          const eyeX = this.facingRight ? this.x - scrollOffsetX + this.size - 14 : this.x - scrollOffsetX + 8;
          ctx.fillRect(eyeX, this.y - scrollOffsetY + 10, 6, 9);
        }
      }

      class Platform {
        constructor(x, y, width, height) { this.x = x; this.y = y; this.width = width; this.height = height; this.color = CONFIG.colors[difficulty]; }
        draw() {
          const currentDiff = (difficulty === 'playground' && playgroundMode === 'play') ? simDifficulty : difficulty;
          const drawColor = (difficulty === 'playground') ? CONFIG.colors[currentDiff] : this.color;
          ctx.strokeStyle = drawColor; ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = drawColor;
          ctx.strokeRect(this.x - scrollOffsetX, this.y - scrollOffsetY, this.width, this.height);
          ctx.fillStyle = drawColor; ctx.globalAlpha = 0.15; ctx.fillRect(this.x - scrollOffsetX, this.y - scrollOffsetY, this.width, this.height);
          ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
        }
      }

      const player = new Player();

      function spawnPlatform() {
        if (difficulty === 'playground') return;
        let width, gap, vRange;
        if (difficulty === 'easy') { width = 250 + Math.random() * 300; gap = 100 + Math.random() * 120; vRange = 250; }
        else if (difficulty === 'normal') { width = 140 + Math.random() * 250; gap = 120 + Math.random() * 160; vRange = 350; }
        else if (difficulty === 'hard') { width = 100 + Math.random() * 150; gap = 180 + Math.random() * 200; vRange = 450; }
        else { width = 80 + Math.random() * 120; gap = 220 + Math.random() * 250; vRange = 600; }
        const lastPlat = platforms[platforms.length - 1];
        const lastY = lastPlat ? lastPlat.y : canvasHeight / 2;
        const y = Math.max(150, Math.min(canvasHeight * 2.0, lastY + (Math.random() - 0.5) * vRange));
        platforms.push(new Platform(nextPlatformX, y, width, 25));
        nextPlatformX += width + gap;
      }

      function checkCollisions() {
        const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
        platforms.forEach((p) => {
          if (player.x + player.size > p.x && player.x < p.x + p.width) {
            const playerBottom = player.y + player.size;
            if (player.vy >= 0 && (player.prevY + player.size) <= p.y + 5 && playerBottom >= p.y) {
              player.y = p.y - player.size; player.vy = 0; player.grounded = true; player.canDash = true;
              player.jumpsLeft = CONFIG.maxJumps[currentDiff]; return;
            }
            if (player.y + player.size > p.y && player.y < p.y + p.height) {
              const overlapLeft = player.x + player.size - p.x; const overlapRight = p.x + p.width - player.x;
              if (!player.grounded && Math.min(overlapLeft, overlapRight) < 20) {
                player.x = overlapLeft < overlapRight ? p.x - player.size : p.x + p.width;
                player.vx = 0; player.onWall = true; player.canDash = true; player.jumpsLeft = CONFIG.maxJumps[currentDiff];
              }
            }
          }
        });
      }

      function drawGrid() {
        const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
        ctx.strokeStyle = CONFIG.colors[currentDiff]; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.05;
        const startX = -(scrollOffsetX % 100); const startY = -(scrollOffsetY % 100);
        for (let x = startX; x < canvasWidth; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); ctx.stroke(); }
        for (let y = startY; y < canvasHeight; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); ctx.stroke(); }
        ctx.globalAlpha = 1.0;
      }

      function update() {
        if (gameState !== 'playing') return;
        player.update(); checkCollisions();
        if (screenShake > 0) screenShake *= 0.9;
        scrollOffsetX += (player.x - canvasWidth * 0.35 - scrollOffsetX) * CONFIG.cameraLerpX;
        scrollOffsetY += (player.y - canvasHeight * 0.5 - scrollOffsetY) * CONFIG.cameraLerpY;
        if (screenShake > 0.5) { scrollOffsetX += (Math.random() - 0.5) * screenShake; scrollOffsetY += (Math.random() - 0.5) * screenShake; }
        distance = Math.max(distance, Math.floor(player.x / 10)); distEl.innerText = distance;
        particles = particles.filter((p) => { p.update(); return p.life > 0; });
        shockwaves = shockwaves.filter((s) => { s.update(); return s.life > 0; });
        if (player.x + canvasWidth > nextPlatformX - 1500) spawnPlatform();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const currentDiff = difficulty === 'playground' ? simDifficulty : difficulty;
        if (currentDiff === 'hard' || currentDiff === 'master') {
          const speed = currentDiff === 'master' ? 300 : 500;
          const pulse = (Math.sin(Date.now() / speed) + 1) * (currentDiff === 'master' ? 0.06 : 0.02);
          ctx.fillStyle = currentDiff === 'master' ? `rgba(255, 170, 0, ${pulse})` : `rgba(255, 0, 85, ${pulse})`;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        }
        drawGrid(); platforms.forEach((p) => p.draw());
        if (currentDragBox && playgroundMode === 'edit') {
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.strokeRect(currentDragBox.x - scrollOffsetX, currentDragBox.y - scrollOffsetY, currentDragBox.w, currentDragBox.h);
            ctx.setLineDash([]);
        }
        particles.forEach((p) => p.draw()); shockwaves.forEach((s) => s.draw());
        if (gameState === 'playing') player.draw();
      }

      function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

      window.startGame = function (diff) {
        difficulty = diff; distance = 0; scrollOffsetX = 0; scrollOffsetY = 0;
        playgroundMode = 'edit'; isFlying = (difficulty === 'playground');
        if (difficulty !== 'playground' || platforms.length === 0) platforms = [];
        particles = []; shockwaves = []; player.reset();
        if (difficulty !== 'playground') {
            platforms.push(new Platform(0, canvasHeight / 2 + 100, 1200, 30));
            nextPlatformX = 1250; for (let i = 0; i < 20; i++) spawnPlatform();
            pgUI.style.display = 'none';
        } else {
            loadProjectRegistry();
            const selectedProject = playgroundProjects.find((p) => p.id === activeProjectId);
            if (selectedProject) applyProjectPayload(selectedProject.payload);
            else platforms = [];
            nextPlatformX = 0; pgUI.style.display = 'block';
            pgStatusText.innerText = 'MODE: EDITING'; pgStatusText.style.color = '#bd00ff';
            projectSelector.style.display = 'none';
        }
        mainMenu.style.display = 'none'; gameOverMenu.style.display = 'none';
        hud.style.display = 'flex'; diffTag.style.display = 'block';
        diffTag.innerText = difficulty === 'playground' ? 'PLAYGROUND PROTOCOL' : difficulty.toUpperCase() + ' PROTOCOL';
        diffTag.style.color = CONFIG.colors[difficulty]; diffTag.style.borderColor = CONFIG.colors[difficulty];
        flightStatus.style.display = (difficulty === 'playground') ? 'block' : 'none';
        flightToggleText.innerText = isFlying ? 'ON' : 'OFF';
        if (difficulty === 'playground') hintText.innerText = 'P: Toggle Play Mode • R: Reset • F: Fly • C: Clear • Drag: Create Plat';
        else hintText.innerText = 'WAD Move • S Blink • Space Jump • Shift Dash • E Grapple';
        gameState = 'playing';
      };

      window.restartGame = function () { startGame(difficulty); };
      window.backToMenu = function () {
        updateMenuScores();
        gameOverMenu.style.display = 'none'; mainMenu.style.display = 'flex';
        hud.style.display = 'none'; diffTag.style.display = 'none'; pgUI.style.display = 'none';
        gameState = 'menu';
      };

      function endGame() {
        if (difficulty === 'playground') return;
        gameState = 'over'; hud.style.display = 'none'; gameOverMenu.style.display = 'flex';
        finalScoreEl.innerText = distance; recordScoreEl.innerText = highscores[difficulty];
        if (saveScore(difficulty, distance)) { highscoreNotif.style.display = 'block'; highscoreNotif.style.color = CONFIG.colors[difficulty]; }
        else highscoreNotif.style.display = 'none';
      }

      gameLoop();
    </script>
  </body>
</html>
