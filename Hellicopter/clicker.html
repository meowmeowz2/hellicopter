<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice Clicker</title>
    <link rel="icon" href="Favicons/clicker.png">
    <link rel="stylesheet" href="clicker/style.css">
</head>
<body>
    <div class="container">
        <button id="clickButton">Click Me!</button>
        <div id="score">Score: 0</div>
        <div class="upgrades">
            <h3>Upgrades</h3>
            <div class="upgrade-item">
                <button id="autoClickerUpgrade">Buy Auto-Clicker (Cost: <span id="autoClickerCost">10</span>)</button>
                <span>Clicks automatically every 1 second.</span>
            </div>
            <div class="upgrade-item">
                <button id="multiplierUpgrade">Buy Score Multiplier (Cost: <span id="multiplierCost">50</span>)</button>
                <span>Multiplies your score per click by 2.</span>
            </div>
            <div class="upgrade-item">
                <button id="clickPowerUpgrade">Buy Click Power (Cost: <span id="clickPowerCost">100</span>)</button>
                <span>Increases score per click by 1.</span>
            </div>
            <div class="upgrade-item">
                <button id="autoSpeedUpgrade">Buy Auto-Clicker Speed (Cost: <span id="autoSpeedCost">200</span>)</button>
                <span>Reduces auto-click interval by 0.1 seconds.</span>
            </div>
            <div class="upgrade-item">
                <button id="multiplierPowerUpgrade">Buy Multiplier Power (Cost: <span id="multiplierPowerCost">500</span>)</button>
                <span>Increases the multiplier effect by 1.5x.</span>
            </div>
        </div>
    </div>
    <script src="clicker/script.js"></script>
</body>
</html>
